    - path: src/data/validator.py
      hash: md5
      md5: b7859913d79386e80187fe150917476a
      size: 3598
    params:
      configs/data_pipeline.yaml:
        split:
          val_size: 0.2
          group_column: user_id
          random_seed: 42
        validation_rules:
          allowed_image_formats:
          - .jpg
          - .jpeg
          - .png
          - .webp
          min_image_resolution:
          - 64
          - 64
          max_image_resolution:
          - 4096
          - 4096
          min_text_length: 10
          max_text_length: 2000
          mask_pii: true
    outs:
