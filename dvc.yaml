# dvc.yaml
# OmniResolve Complete 6-Stage End-to-End MLOps Pipeline DAG
stages:
  prepare_multimodal_dataset:
    cmd: python src/data/pipeline.py --config configs/data_pipeline.yaml
    deps:
      - src/data/schema.py
      - src/data/validator.py
      - src/data/processor.py
      - src/data/pipeline.py
      - data/raw/tickets.jsonl
    params:
      - configs/data_pipeline.yaml:
          - validation_rules
          - split
    outs:
      - data/processed/train_manifest.parquet
      - data/processed/val_manifest.parquet
    metrics:
      - data/processed/validation_report.yaml:
          cache: false

  build_multimodal_features:
    cmd: python src/data/build_features.py
    deps:
      - src/data/feature_extractor.py
      - src/data/build_features.py
      - data/processed/train_manifest.parquet
      - data/processed/val_manifest.parquet
    outs:
      - data/processed/features/train_features.npz
      - data/processed/features/val_features.npz
    metrics:
      - data/processed/features/feature_metadata.json:
          cache: false

  train_and_benchmark:
    cmd: python src/models/train_and_benchmark.py
    deps:
      - src/models/network.py
      - src/models/train_and_benchmark.py
      - data/processed/features/train_features.npz
      - data/processed/features/val_features.npz
    outs:
      - models/checkpoints/best_fusion_model.pt
    metrics:
      - models/model_selection_evidence.json:
          cache: false

  optimize_and_export:
    cmd: python src/models/export_optimized.py
    deps:
      - src/models/network.py
      - src/models/export_optimized.py
      - models/checkpoints/best_fusion_model.pt
    outs:
      - models/optimized/multimodal_fusion.onnx
    metrics:
      - models/optimized/optimization_benchmark.json:
          cache: false

  evaluate_production_model:
    cmd: python src/evaluation/run_evaluation.py
    deps:
      - src/evaluation/evaluator.py
      - src/evaluation/run_evaluation.py
      - models/optimized/multimodal_fusion.onnx
      - data/processed/val_manifest.parquet
      - data/processed/features/val_features.npz
    metrics:
      - models/evaluation_report.json:
          cache: false

  monitor_data_drift:
    cmd: python src/monitoring/run_drift_monitor.py
    deps:
      - src/monitoring/drift_detector.py
      - src/monitoring/run_drift_monitor.py
      - data/processed/train_manifest.parquet
    metrics:
      - data/processed/drift_report.json:
          cache: false
